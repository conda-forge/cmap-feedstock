{% set name = "cmap" %}
{% set version = "0.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/cmap-{{ version }}.tar.gz
  sha256: ed69913f26c3227fc212f3200213f64c0e2fad010e0fd6835280ca4b8b617832

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - numpy

test:
  imports:
    - cmap
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://github.com/tlambert03/cmap
  summary: Scientific colormaps for python, with only numpy dependency
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSES/
  doc_url: https://cmap-docs.rtfd.io
  dev_url: https://github.com/tlambert03/cmap

extra:
  recipe-maintainers:
    - tlambert03
